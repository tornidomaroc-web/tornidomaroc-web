<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
<defs><style>
  .name{font-family:'Courier New',monospace;font-size:56px;font-weight:700;fill:#0a0a0a;letter-spacing:-2px}
  .line{stroke:#e0e0dc;stroke-width:1}
  .stmt{font-family:'Courier New',monospace;font-size:14px;fill:#111}
  .meta{font-family:'Courier New',monospace;font-size:11px;fill:#888;letter-spacing:0.08em}
  .cursor{fill:#1D9E75;animation:blink 1s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .n{animation:up .4s ease both}
  .s{animation:up .4s ease .2s both}
  .m{animation:up .4s ease .4s both}
  .d{animation:up .4s ease .6s both}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style></defs>
<rect width="800" height="200" fill="#f9f9f7"/>
<g class="n">
  <text x="32" y="90" class="name">Abo Jad</text>
  <rect x="278" y="46" width="8" height="52" rx="1" class="cursor"/>
</g>
<line x1="32" y1="108" x2="768" y2="108" class="line s"/>
<g class="s">
  <text x="32" y="132" class="stmt">I build AI products end to end, in Arabic, English and French.</text>
</g>
<g class="m">
  <text x="32" y="161" class="meta">MOROCCO · 4 APPS IN THE STORES · FULL-STACK · AI</text>
</g>
<g class="d">
  <rect x="32" y="182" width="48" height="2" rx="1" fill="#1D9E75"/>
  <rect x="88" y="182" width="24" height="2" rx="1" fill="#BA7517"/>
  <rect x="120" y="182" width="16" height="2" rx="1" fill="#185FA5"/>
</g>
</svg>
